version: 2
updates:
  # Action majors drift, and stale ones are what produce the Node runtime
  # deprecation warnings in workflow logs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      vitepress:
        patterns:
          - vitepress
          - vitepress-*
          - mermaid
    ignore:
      # mermaid 12 mis-measures node heights and clips wrapped labels;
      # markdown-it-mathjax3 5 emits its stylesheet HTML-escaped into the page.
      # Both are pinned. Re-test the diagrams and formulas before unpinning.
      - dependency-name: mermaid
        update-types: [version-update:semver-major]
      - dependency-name: markdown-it-mathjax3
        update-types: [version-update:semver-major]
